services:
  farm:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    container_name: cs2-commend-farm
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - ./data:/app/data
    environment:
      - FARM_DATA_DIR=/app/data
      - ASPNETCORE_ENVIRONMENT=Production
    # Build from local Dockerfile:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # ОДИН артефакт — commend-farm.dll из src/CommendFarm/publish/
    # Собери локально: cd src/CommendFarm && dotnet publish -c Release -o publish
